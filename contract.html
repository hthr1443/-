<script>
// ============================================================
// IndexedDB Storage Layer
// ============================================================
const DB = {
    db: null,
    init() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('salah-contract', 1);
            req.onupgradeneeded = (e) => {
                const d = e.target.result;
                if (!d.objectStoreNames.contains('weeks')) d.createObjectStore('weeks', { keyPath: 'id' });
                if (!d.objectStoreNames.contains('backups')) d.createObjectStore('backups', { keyPath: 'timestamp' });
            };
            req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
            req.onerror = () => reject(req.error);
        });
    },
    getAll(store) {
        return new Promise((resolve, reject) => {
            const req = this.db.transaction(store, 'readonly').objectStore(store).getAll();
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    },
    put(store, data) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(store, 'readwrite');
            tx.objectStore(store).put(data);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    },
    del(store, key) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(store, 'readwrite');
            tx.objectStore(store).delete(key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }
};

// ============================================================
// Backup System — auto daily at 12:00, max 30 copies
// ============================================================
const Backup = {
    HOUR: 12,
    MAX: 30,
    async check() {
        const today = new Date().toDateString();
        if (localStorage.getItem('backup-date') === today) return false;
        if (new Date().getHours() >= this.HOUR) {
            await this.create();
            localStorage.setItem('backup-date', today);
            return true;
        }
        return false;
    },
    async create() {
        const weeks = await DB.getAll('weeks');
        await DB.put('backups', {
            timestamp: Date.now(),
            date: new Date().toLocaleDateString('ar-SA'),
            dateISO: new Date().toISOString(),
            weekCount: weeks.length,
            data: weeks
        });
        await this.prune();
    },
    async prune() {
        const all = await DB.getAll('backups');
        if (all.length > this.MAX) {
            all.sort((a, b) => a.timestamp - b.timestamp);
            for (const b of all.slice(0, all.length - this.MAX)) {
                await DB.del('backups', b.timestamp);
            }
        }
    },
    download(backup) {
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'contract-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    },
    async downloadLatest() {
        let all = await DB.getAll('backups');
        if (all.length === 0) { await this.create(); all = await DB.getAll('backups'); }
        all.sort((a, b) => b.timestamp - a.timestamp);
        if (all[0]) this.download(all[0]);
    }
};

// ============================================================
// Image Compression
// ============================================================
function compressImage(dataUrl, maxDim) {
    maxDim = maxDim || 800;
    return new Promise(function(resolve) {
        var img = new Image();
        img.onload = function() {
            var w = img.width, h = img.height;
            if (w <= maxDim && h <= maxDim) { resolve(dataUrl); return; }
            var ratio = Math.min(maxDim / w, maxDim / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
            var c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = function() { resolve(dataUrl); };
        img.src = dataUrl;
    });
}

// ============================================================
// Service Worker Registration
// ============================================================
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('contract-sw.js').catch(function() {});
}

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ============================================================
// Color Palette & Theme Presets
// ============================================================
const textColorPalette = [
    { name: 'ثلجي', value: '#e0f2fe' }, { name: 'أحمر', value: '#fca5a5' },
    { name: 'أصفر', value: '#fde047' }, { name: 'أخضر', value: '#86efac' },
    { name: 'أزرق', value: '#93c5fd' }, { name: 'وردي', value: '#f9a8d4' },
    { name: 'برتقالي', value: '#fdba74' }, { name: 'بنفسجي', value: '#d8b4fe' },
];

const themePresets = [
    { name: 'أزرق داكن (افتراضي)', type: 'gradient', value: 'from-slate-900 via-blue-950 to-cyan-950' },
    { name: 'غسق (بنفسجي)', type: 'gradient', value: 'from-slate-900 via-purple-900 to-slate-900' },
    { name: 'غابة (أخضر داكن)', type: 'gradient', value: 'from-slate-900 via-emerald-950 to-teal-900' },
    { name: 'صحراء (بني وذهبي)', type: 'gradient', value: 'from-slate-900 via-stone-800 to-amber-900/50' },
    { name: 'أسود مطفي', type: 'gradient', value: 'from-black via-zinc-900 to-black' },
    { name: 'نار هادئة', type: 'gradient', value: 'from-slate-900 via-red-950 to-orange-950' },
];

// ============================================================
// Helper: Create New Week
// ============================================================
function createNewWeek(version, previousData) {
    const base = {
        id: Date.now(),
        contractNumber: String(version),
        dateCreated: new Date().toLocaleDateString('ar-SA'),
        background: { type: 'gradient', value: 'from-slate-900 via-blue-950 to-cyan-950' },
        fundamentalAmendments: { text: '', color: '#fde047' },
        coreImages: [],
        permanentExceptions: { text: '', color: '#e0f2fe' },
        temporaryExceptions: { text: '', color: '#e0f2fe' },
        violationsList: [],
        lessonsLearned: { text: '', color: '#fbcfe8' },
        poems: [],
        isSigned: false,
        complianceItems: [
            { id: 1, text: 'أداء الصلوات في وقتها', color: '#e0f2fe' },
            { id: 2, text: 'الالتزام بورد القرآن', color: '#e0f2fe' },
        ]
    };

    if (!previousData) return base;

    return {
        ...base,
        complianceItems: Array.isArray(previousData.complianceItems) && previousData.complianceItems.length > 0
            ? previousData.complianceItems.map(function(item) { return { ...item }; })
            : base.complianceItems,
        fundamentalAmendments: previousData.fundamentalAmendments
            ? { ...previousData.fundamentalAmendments }
            : base.fundamentalAmendments,
        permanentExceptions: previousData.permanentExceptions
            ? { ...previousData.permanentExceptions }
            : base.permanentExceptions,
        poems: Array.isArray(previousData.poems)
            ? previousData.poems.map(function(p) { return { ...p, isExpanded: false }; })
            : [],
    };
}

// ============================================================
// Display Block Component
// ============================================================
function DisplayBlock({ title, text, color, onOpenEditor, minHeight, extraClass, icon }) {
    return (
        <div onClick={onOpenEditor} className={'group relative bg-slate-900/60 backdrop-blur-md p-4 rounded-xl border border-cyan-800/50 hover:border-cyan-400/80 cursor-pointer transition-all overflow-hidden shadow-[0_4px_20px_rgba(0,0,0,0.3)] ' + (minHeight || 'min-h-[3rem]') + ' ' + (extraClass || '')}>
            <div className="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity z-0 pointer-events-none" />
            <div className="relative z-10 flex justify-between items-start mb-2">
                {title && <label className="text-xs font-bold text-cyan-400 flex items-center gap-1">{icon}{title}</label>}
                <span className="text-cyan-200 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] bg-slate-800/80 px-2 py-1 rounded shadow-sm border border-cyan-600/50">✎ تعديل</span>
            </div>
            <div className="relative z-10 text-sm whitespace-pre-wrap break-words leading-relaxed" style={{ color: color }}>
                {text || <span className="text-slate-400 italic opacity-70">اضغط هنا للكتابة...</span>}
            </div>
        </div>
    );
}

// ============================================================
// Main App Component
// ============================================================
function App() {
    const [loading, setLoading] = useState(true);
    const [weeks, setWeeks] = useState([]);
    const [currentWeekId, setCurrentWeekId] = useState(null);
    const [isOnline, setIsOnline] = useState(navigator.onLine);
    const [syncStatus, setSyncStatus] = useState('');
    const [lastBackupInfo, setLastBackupInfo] = useState(null);

    const [activeEditor, setActiveEditor] = useState(null);
    const [showStatsModal, setShowStatsModal] = useState(false);
    const [showThemeModal, setShowThemeModal] = useState(false);
    const [showRankModal, setShowRankModal] = useState(false);
    const [showSurpriseModal, setShowSurpriseModal] = useState(false);
    const [showBackupModal, setShowBackupModal] = useState(false);
    const [zoomedImage, setZoomedImage] = useState(null);

    const [newViolationAmount, setNewViolationAmount] = useState('');
    const [newViolationNote, setNewViolationNote] = useState('');
    const [newPoemTitle, setNewPoemTitle] = useState('');
    const [newPoemContent, setNewPoemContent] = useState('');

    const fileInputRef = useRef(null);
    const coreImageInputRef = useRef(null);
    const restoreInputRef = useRef(null);
    const saveTimerRef = useRef(null);

    // ---- Init ----
    useEffect(function() {
        (async function() {
            try {
                await DB.init();
                const loaded = await DB.getAll('weeks');
                loaded.sort(function(a, b) { return b.id - a.id; });

                if (loaded.length > 0) {
                    setWeeks(loaded);
                    setCurrentWeekId(loaded[0].id);
                } else {
                    const first = createNewWeek(1);
                    await DB.put('weeks', first);
                    setWeeks([first]);
                    setCurrentWeekId(first.id);
                }

                const didBackup = await Backup.check();
                if (didBackup) {
                    setSyncStatus('تم النسخ الاحتياطي ✅');
                    setTimeout(function() { setSyncStatus(''); }, 3000);
                }
                await refreshBackupInfo();
            } catch (err) {
                console.error('Init error:', err);
            } finally {
                setLoading(false);
            }
        })();

        function goOnline() { setIsOnline(true); setSyncStatus('متصل ✅'); setTimeout(function() { setSyncStatus(''); }, 2000); }
        function goOffline() { setIsOnline(false); setSyncStatus('غير متصل — الوضع المحلي 📱'); }
        window.addEventListener('online', goOnline);
        window.addEventListener('offline', goOffline);

        var backupTimer = setInterval(async function() {
            try {
                var did = await Backup.check();
                if (did) {
                    setSyncStatus('تم النسخ الاحتياطي التلقائي ✅');
                    setTimeout(function() { setSyncStatus(''); }, 3000);
                    await refreshBackupInfo();
                }
            } catch (e) { /* silent */ }
        }, 60000);

        return function() {
            window.removeEventListener('online', goOnline);
            window.removeEventListener('offline', goOffline);
            clearInterval(backupTimer);
        };
    }, []);

    async function refreshBackupInfo() {
        var all = await DB.getAll('backups');
        if (all.length > 0) {
            all.sort(function(a, b) { return b.timestamp - a.timestamp; });
            setLastBackupInfo({ time: all[0].date, count: all.length });
        } else {
            setLastBackupInfo(null);
        }
    }

    // ---- Save (debounced to IndexedDB) ----
    function saveWeek(weekData) {
        clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(function() {
            DB.put('weeks', weekData).catch(function(err) {
                console.error('Save error:', err);
                setSyncStatus('خطأ في الحفظ ❌');
            });
        }, 300);
    }

    // ---- Derived state ----
    var currentWeek = weeks.find(function(w) { return w.id === currentWeekId; }) || weeks[0];
    var currentWeekIndex = weeks.findIndex(function(w) { return w.id === currentWeekId; });

    // ---- Update helpers ----
    function updateCurrentWeek(updated) {
        setWeeks(function(prev) { return prev.map(function(w) { return w.id === currentWeekId ? updated : w; }); });
        saveWeek(updated);
    }

    function handleUpdate(key, value) {
        if (!currentWeek) return;
        updateCurrentWeek({ ...currentWeek, [key]: value });
    }

    function handleComplexUpdate(key, field, value) {
        if (!currentWeek) return;
        var obj = currentWeek[key] || { text: '', color: '#e0f2fe' };
        updateCurrentWeek({ ...currentWeek, [key]: { ...obj, [field]: value } });
    }

    function handleItemUpdate(idx, field, value) {
        if (!currentWeek) return;
        var items = [...(currentWeek.complianceItems || [])];
        items[idx] = { ...items[idx], [field]: value };
        updateCurrentWeek({ ...currentWeek, complianceItems: items });
    }

    // ---- Week operations ----
    function handleCreateNewWeek() {
        var nextVer = parseInt(currentWeek.contractNumber) + 1 || weeks.length + 1;
        var nw = createNewWeek(nextVer, currentWeek);
        DB.put('weeks', nw);
        setWeeks(function(prev) { return [nw, ...prev]; });
        setCurrentWeekId(nw.id);
    }

    async function handleDeleteWeek(weekId) {
        if (weeks.length <= 1) return;
        if (!confirm('هل تريد حذف هذا الأسبوع نهائياً؟')) return;
        await DB.del('weeks', weekId);
        var remaining = weeks.filter(function(w) { return w.id !== weekId; });
        setWeeks(remaining);
        if (currentWeekId === weekId) setCurrentWeekId(remaining[0] ? remaining[0].id : null);
    }

    // ---- Stats ----
    function generateStats() {
        var allTimeScore = 0, todayScore = 0, maxViolationInOneWeek = 0;
        var startOfToday = new Date().setHours(0, 0, 0, 0);

        weeks.forEach(function(w) {
            var weekTotal = 0;
            (w.violationsList || []).forEach(function(v) {
                var amt = Number(v.amount) || 0;
                allTimeScore += amt;
                weekTotal += amt;
                if (v.timestamp >= startOfToday) todayScore += amt;
            });
            if (weekTotal > maxViolationInOneWeek) maxViolationInOneWeek = weekTotal;
        });

        var weekly = currentWeek ? (currentWeek.violationsList || []).reduce(function(a, b) { return a + (Number(b.amount) || 0); }, 0) : 0;
        var totalWeeks = weeks.length;
        var perfectWeeks = weeks.filter(function(w) { return (!w.violationsList || w.violationsList.length === 0) && w.isSigned; }).length;

        var deepInsight;
        if (weekly === 0) {
            deepInsight = { title: 'صفاء وإشراق', desc: 'روحك خفيفة هذا الأسبوع، لم تكبلها قيود المخالفات.', color: 'text-emerald-400', quote: 'من لزم الاستقامة، أشرقت في قلبه الكرامة' };
        } else if (weekly <= 50) {
            deepInsight = { title: 'جهاد النفس', desc: 'هناك كبوات صغيرة، لكن الميزان لا يزال في صالحك.', color: 'text-yellow-400', quote: 'والذين جاهدوا فينا لنهدينهم سبلنا' };
        } else if (weekly <= 150) {
            deepInsight = { title: 'جرس إنذار', desc: 'الهوى بدأ يثقل كاهلك. تحتاج إلى وقفة صارمة مع ذاتك الآن.', color: 'text-orange-400', quote: 'لا تحقرن صغيرة إن الجبال من الحصى' };
        } else {
            deepInsight = { title: 'عاصفة الغفلة', desc: 'لقد ابتعدت كثيراً. عد واغسل هذا الركام بتوبة صادقة.', color: 'text-rose-500', quote: 'إن النفس لأمارة بالسوء إلا ما رحم ربي' };
        }

        return { today: todayScore, weekly: weekly, allTime: allTimeScore, maxViolationInOneWeek: maxViolationInOneWeek, totalWeeks: totalWeeks, perfectWeeks: perfectWeeks, deepInsight: deepInsight };
    }

    var stats = generateStats();

    // ---- Violations ----
    function addViolation() {
        var amount = parseInt(newViolationAmount);
        if (!amount || isNaN(amount) || amount <= 0) return;
        var dateStr = new Date().toLocaleDateString('ar-SA', { weekday: 'long', month: 'long', day: 'numeric' });
        var v = { id: Date.now(), amount: amount, dateStr: dateStr, timestamp: Date.now(), note: (newViolationNote || '').trim() };
        handleUpdate('violationsList', [v, ...(currentWeek.violationsList || [])]);
        setNewViolationAmount('');
        setNewViolationNote('');
    }

    function removeViolation(idToRemove) {
        handleUpdate('violationsList', (currentWeek.violationsList || []).filter(function(v) { return v.id !== idToRemove; }));
    }

    // ---- Poems ----
    function handleAddPoem() {
        if (!newPoemTitle || !newPoemContent) return;
        var poem = { id: Date.now(), title: newPoemTitle, content: newPoemContent, isExpanded: false };
        handleUpdate('poems', [...(currentWeek.poems || []), poem]);
        setNewPoemTitle('');
        setNewPoemContent('');
        setActiveEditor(null);
    }

    function togglePoemExpand(id) {
        handleUpdate('poems', (currentWeek.poems || []).map(function(p) { return p.id === id ? { ...p, isExpanded: !p.isExpanded } : p; }));
    }

    function removePoem(id) {
        handleUpdate('poems', (currentWeek.poems || []).filter(function(p) { return p.id !== id; }));
    }

    // ---- Compliance items ----
    function handleDeleteItem(idx) {
        if (!currentWeek.complianceItems || currentWeek.complianceItems.length <= 1) return;
        updateCurrentWeek({ ...currentWeek, complianceItems: currentWeek.complianceItems.filter(function(_, i) { return i !== idx; }) });
    }

    // ---- Sign ----
    function signContract() { handleUpdate('isSigned', true); setShowRankModal(true); }

    // ---- Images ----
    function handleImageUpload(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onloadend = async function() {
            var compressed = await compressImage(reader.result, 1200);
            handleUpdate('background', { type: 'image', value: compressed });
            setShowThemeModal(false);
        };
        reader.readAsDataURL(file);
    }

    async function handleAddCoreImages(e) {
        var files = Array.from(e.target.files);
        if (files.length === 0) return;
        var promises = files.map(function(file) {
            return new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onloadend = async function() {
                    var compressed = await compressImage(reader.result, 800);
                    resolve({ id: Date.now() + Math.random(), url: compressed });
                };
                reader.readAsDataURL(file);
            });
        });
        var newImages = await Promise.all(promises);
        handleUpdate('coreImages', [...(currentWeek.coreImages || []), ...newImages]);
        e.target.value = null;
    }

    function handleDeleteCoreImage(e, imgId) {
        e.stopPropagation();
        handleUpdate('coreImages', (currentWeek.coreImages || []).filter(function(img) { return img.id !== imgId; }));
    }

    // ---- Backup ----
    async function handleManualBackup() {
        await Backup.create();
        await refreshBackupInfo();
        setSyncStatus('تم النسخ الاحتياطي ✅');
        setTimeout(function() { setSyncStatus(''); }, 3000);
    }

    async function handleRestore(e) {
        var file = e.target.files[0];
        if (!file) return;
        try {
            var text = await file.text();
            var backup = JSON.parse(text);
            var data = backup.data;
            if (!Array.isArray(data) || data.length === 0) { alert('ملف النسخة الاحتياطية غير صالح'); return; }
            for (var i = 0; i < data.length; i++) {
                if (!data[i].id || !data[i].contractNumber) { alert('بيانات غير صالحة في الملف'); return; }
            }
            for (var j = 0; j < data.length; j++) { await DB.put('weeks', data[j]); }
            var loaded = await DB.getAll('weeks');
            loaded.sort(function(a, b) { return b.id - a.id; });
            setWeeks(loaded);
            if (loaded.length > 0) setCurrentWeekId(loaded[0].id);
            setSyncStatus('تم الاستعادة بنجاح ✅');
            setTimeout(function() { setSyncStatus(''); }, 3000);
            setShowBackupModal(false);
        } catch (err) {
            alert('خطأ في قراءة الملف');
        }
        e.target.value = null;
    }

    // ---- Loading screen ----
    if (loading) {
        return (
            <div dir="rtl" className="min-h-screen bg-slate-950 flex flex-col items-center justify-center text-cyan-400">
                <div className="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-cyan-400 mb-4"></div>
                <h2 className="text-xl font-bold animate-pulse">جاري التحميل...</h2>
            </div>
        );
    }

    if (!currentWeek) return null;

    // ---- Derived UI values ----
    var appBgStyle = currentWeek.background && currentWeek.background.type === 'image'
        ? { backgroundImage: 'url(' + currentWeek.background.value + ')', backgroundSize: 'cover', backgroundPosition: 'center', backgroundAttachment: 'fixed' }
        : {};
    var appBgClass = currentWeek.background && currentWeek.background.type === 'gradient'
        ? 'bg-gradient-to-br ' + currentWeek.background.value
        : 'bg-slate-900';

    var pulseOrbColor = 'bg-emerald-500 shadow-[0_0_20px_rgba(16,185,129,0.8)]';
    var pulseAnim = 'animate-pulse';
    if (stats.weekly > 0 && stats.weekly <= 50) { pulseOrbColor = 'bg-yellow-500 shadow-[0_0_20px_rgba(234,179,8,0.8)]'; }
    else if (stats.weekly > 50 && stats.weekly <= 150) { pulseOrbColor = 'bg-orange-500 shadow-[0_0_30px_rgba(249,115,22,0.9)]'; pulseAnim = 'animate-bounce'; }
    else if (stats.weekly > 150) { pulseOrbColor = 'bg-rose-600 shadow-[0_0_40px_rgba(225,29,72,1)]'; pulseAnim = 'animate-ping'; }

    // ============================================================
    // RENDER
    // ============================================================
    return (
    <div dir="rtl" className={'min-h-screen text-cyan-50 p-4 sm:p-6 font-sans selection:bg-cyan-700 selection:text-white flex flex-col md:flex-row gap-6 relative transition-all duration-700 ' + appBgClass} style={appBgStyle}>

            <React.Fragment>

                            <div className="p-5 border-b border-white/5 bg-black/20">
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <input type="number" min="1" value={newViolationAmount} onChange={function(e) { setNewViolationAmount(e.target.value); }} placeholder="المبلغ (موجب)" className="w-full sm:w-32 bg-white/5 border border-rose-500/30 rounded-xl px-4 py-3 text-white focus:outline-none" />
                                    <input type="text" value={newViolationNote} onChange={function(e) { setNewViolationNote(e.target.value); }} placeholder="ملاحظة" className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white" />
                                    <button onClick={addViolation} disabled={!newViolationAmount || parseInt(newViolationAmount) <= 0} className="bg-rose-600 hover:bg-rose-500 text-white px-6 py-3 rounded-xl disabled:opacity-50">إضافة</button>
                                </div>
                            </div>
                            <div className="p-5 overflow-y-auto custom-scrollbar flex-1">
                                {(currentWeek.violationsList || []).map(function(v) {
                                    return (
                                        <div key={v.id} className="flex justify-between items-center bg-white/5 p-4 rounded-2xl mb-3 border border-white/5 group">
                                            <div><span className="text-rose-400 font-bold ml-3">{v.amount} ريال</span><span className="text-sm text-slate-300">{v.note}</span><span className="text-xs text-slate-500 mr-3">{v.dateStr}</span></div>
                                            <button onClick={function() { removeViolation(v.id); }} className="text-slate-500 hover:text-rose-500">حذف</button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ) : activeEditor.type === 'newPoem' ? (
                        <div className="flex flex-col h-full p-6 space-y-4">
                            <input type="text" value={newPoemTitle} onChange={function(e) { setNewPoemTitle(e.target.value); }} placeholder="عنوان القصيدة..." className="w-full bg-white/5 border border-indigo-500/30 rounded-xl px-4 py-3 text-indigo-200 focus:outline-none text-lg font-bold" />
                            <textarea value={newPoemContent} onChange={function(e) { setNewPoemContent(e.target.value); }} placeholder="اكتب أبياتك هنا..." className="flex-1 w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white resize-none focus:outline-none leading-loose text-center font-serif text-lg custom-scrollbar" />
                            <button onClick={handleAddPoem} disabled={!newPoemTitle || !newPoemContent} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl disabled:opacity-50 transition-all">حفظ القصيدة</button>
                        </div>
                    ) : (
                        <React.Fragment>
                            <textarea
                                className="flex-1 w-full bg-slate-900/50 p-6 text-base font-medium outline-none resize-none leading-relaxed custom-scrollbar"
                                style={{ color: activeEditor.type === 'item' ? (currentWeek.complianceItems[activeEditor.index] || {}).color || '#e0f2fe' : ((currentWeek[activeEditor.key] || {}).color || '#e0f2fe') }}
                                value={activeEditor.type === 'item' ? (currentWeek.complianceItems[activeEditor.index] || {}).text || '' : ((currentWeek[activeEditor.key] || {}).text || '')}
                                autoFocus
                                onChange={function(e) {
                                    if (activeEditor.type === 'item') handleItemUpdate(activeEditor.index, 'text', e.target.value);
                                    else handleComplexUpdate(activeEditor.key, 'text', e.target.value);
                                }}
                            />
                            {/* Color Picker */}
                            <div className="p-3 border-t border-white/10 flex items-center gap-2 flex-wrap bg-slate-900/80">
                                <span className="text-xs text-slate-400 ml-2">اللون:</span>
                                {textColorPalette.map(function(c) {
                                    var isActive = activeEditor.type === 'item'
                                        ? (currentWeek.complianceItems[activeEditor.index] || {}).color === c.value
                                        : ((currentWeek[activeEditor.key] || {}).color || '') === c.value;
                                    return (
                                        <button
                                            key={c.value}
                                            onClick={function() {
                                                if (activeEditor.type === 'item') handleItemUpdate(activeEditor.index, 'color', c.value);
                                                else handleComplexUpdate(activeEditor.key, 'color', c.value);
                                            }}
                                            className={'w-7 h-7 rounded-full transition-all hover:scale-110 ' + (isActive ? 'border-[3px] border-white scale-110' : 'border-2 border-white/20')}
                                            style={{ backgroundColor: c.value }}
                                            title={c.name}
                                        />
                                    );
                                })}
                            </div>
                        </React.Fragment>
                    )}
                </div>
            </div>
        )}

        {/* Zoomed Image */}
        {zoomedImage && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 cursor-zoom-out p-4" onClick={function() { setZoomedImage(null); }}>
                <img src={zoomedImage} className="max-w-full max-h-full object-contain rounded-xl" onClick={function(e) { e.stopPropagation(); }} alt="" />
            </div>
        )}

        {/* Theme Modal */}
        {showThemeModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80" onClick={function() { setShowThemeModal(false); }}>
                <div className="bg-slate-900 w-full max-w-xl rounded-3xl p-6 border border-white/10 animate-fade-in-up" onClick={function(e) { e.stopPropagation(); }}>
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-xl font-bold text-purple-300">🎨 المظهر</h3>
                        <button onClick={function() { setShowThemeModal(false); }} className="text-slate-400 hover:text-white">✕</button>
                    </div>
                    <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImageUpload} className="hidden" />
                    <button onClick={function() { fileInputRef.current.click(); }} className="w-full py-3 mb-4 border-2 border-dashed border-purple-500/30 text-purple-200 rounded-xl hover:bg-purple-900/20 transition-all">صورة من جهازك</button>
                    <div className="grid grid-cols-2 gap-2">
                        {themePresets.map(function(theme, i) {
                            return (
                                <button key={i} onClick={function() { handleUpdate('background', { type: theme.type, value: theme.value }); setShowThemeModal(false); }} className={'p-3 rounded-xl border border-white/10 text-xs text-white bg-gradient-to-l ' + theme.value + ' hover:scale-[1.02] transition-all'}>
                                    {theme.name}
                                </button>
                            );
                        })}
                    </div>
                </div>
            </div>
        )}

        {/* Rank Modal */}
        {showRankModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/90" onClick={function() { setShowRankModal(false); }}>
                <div className="bg-slate-900 border border-amber-500/50 rounded-3xl p-8 text-center max-w-sm animate-fade-in-up" onClick={function(e) { e.stopPropagation(); }}>
                    <div className="text-6xl mb-4">👑</div>
                    <h2 className="text-2xl font-bold text-amber-400 mb-2">تم الاعتماد</h2>
                    <p className="text-slate-300 mb-6">عهد جديد، وبداية جديدة وموثقة.</p>
                    <button onClick={function() { setShowRankModal(false); }} className="bg-white/10 text-white px-6 py-2 rounded-xl hover:bg-white/20 transition-all">موافق</button>
                </div>
            </div>
        )}

    </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
